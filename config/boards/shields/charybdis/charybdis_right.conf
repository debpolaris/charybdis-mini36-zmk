CONFIG_SPI=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y

### 기본 마우스 속도: 숫자가 클수록 빠름
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_90=y

### Snipe 레이어 속도: 200~400 사이에서 손에 맞는 속도 200
CONFIG_PMW3610_SNIPE_CPI=200
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1

### 스크롤 속도 조정: 숫자가 작을수록 한 번 굴릴 때 더 많이 움직임(더 민감해짐)	100
CONFIG_PMW3610_SCROLL_TICK=120
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_SMART_ALGORITHM=y

### 트랙볼 움직임이 멈춘 후 ms 후에 마우스 모드 자동 비활성화하는 설정
# 250ms (빠른 복귀), 500ms (균형), 1초 (배터리 절약 우선), 주석처리 (항상 마우스 모드)
